name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbdialect-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            publish/assets/fonts \
            publish/data/extracted \
            publish/docs/example-frontend/assets/fonts

          cp index.html app.js styles.css hubei.geojson publish/
          cp \
            assets/fonts/SourceHanSerifCN-Prototype.woff2 \
            assets/fonts/LICENSE.txt \
            publish/assets/fonts/
          cp data/geography.json publish/data/
          cp data/extracted/ben.json publish/data/extracted/
          cp docs/README.md publish/docs/
          cp \
            docs/example-frontend/index.html \
            docs/example-frontend/styles.css \
            docs/example-frontend/app.js \
            docs/example-frontend/hubei.geojson \
            publish/docs/example-frontend/
          cp \
            docs/example-frontend/assets/fonts/SourceHanSerifCN-Prototype.woff2 \
            docs/example-frontend/assets/fonts/LICENSE.txt \
            publish/docs/example-frontend/assets/fonts/
          touch publish/.nojekyll

      - name: Publish to hbdialect.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.HBDIALECT_PAGES_DEPLOY_KEY }}
          external_repository: hbdialect/hbdialect.github.io
          publish_branch: gh-pages
          publish_dir: ./publish
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy AstrophelXD/hbdialect@${{ github.sha }}"
