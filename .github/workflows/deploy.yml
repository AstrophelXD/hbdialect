name: Deploy website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hbdialect-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            publish/data/extracted \
            publish/docs

          cp index.html app.js styles.css hubei.geojson publish/
          cp \
            data/geography.json \
            data/display_areas_simplified.geojson \
            data/admin_boundary.geojson \
            publish/data/
          cp \
            data/extracted/ben.json \
            data/extracted/shuijiao.json \
            publish/data/extracted/
          cp docs/README.md publish/docs/

          touch publish/.nojekyll

      - name: Publish to hbdialect.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.HBDIALECT_PAGES_DEPLOY_KEY }}
          external_repository: hbdialect/hbdialect.github.io
          publish_branch: gh-pages
          publish_dir: ./publish
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy AstrophelXD/hbdialect@${{ github.sha }}"
